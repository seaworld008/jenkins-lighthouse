name: "🐛 脚本缺陷 / Script bug"
description: 某个脚本行为不对 / A script in the toolkit misbehaves
title: "bug(<script>): "
labels: [bug, area:scripts]
body:
  - type: dropdown
    id: script
    attributes:
      label: 脚本 / Script
      options: [survey-jenkins.sh, scan-job-commands.py, run-as-agent.sh, find-missing-base-images.sh, groovy snippets, fleet_exec.py, tls_scan.py, trial_swap.sh, tools/check_repo.py, tools/changelog_section.py]
    validations: { required: true }
  - type: dropdown
    id: topic
    attributes:
      label: 领域 / Area
      options: [jenkins-lts-upgrade, nginx-vuln-upgrade, repo tooling]
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: 目标机系统 / Target OS
      placeholder: "cat /etc/os-release；Jenkins/nginx 版本"
    validations: { required: true }
  - type: textarea
    id: cmd
    attributes:
      label: 执行的命令 / Command
      render: shell
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: 实际输出（脱敏）/ Actual output (sanitized)
      render: shell
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: 期望 / Expected
